name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - run: bun run format
      - run: bunx eslint . --max-warnings=0
      - run: bun run typecheck

      # 생성물이 커밋되어 있으므로 재생성은 no-op이어야 한다. 트리가 더러워지면
      # 누군가 `t()` 키를 추가하고 `bun run gen`을 안 돌린 것이다.
      # `removeUnusedKeys` 덕에 유령 로케일 키도 같은 스텝에서 잡힌다.
      - run: bun run gen
      - name: generated output is stale
        run: git diff --exit-code || { echo '::error::run `bun run gen` and commit'; exit 1; }

      # vitest가 스토리를 실제 브라우저에서 돌린다. 이력서 PDF도 이 브라우저로 굽는다.
      - run: bunx playwright install --with-deps chromium
      - run: bun run test

      # `build`가 끝에 이력서 PDF를 다시 굽는다. 커밋된 것과 달라지면 데이터를 고치고
      # PDF를 안 올린 것이다. 폰트를 자체 호스팅해서 이 이미지에서도 같은 결과가 나온다.
      - run: bun run build
      - name: resume pdf is stale
        run: git diff --exit-code -- public || { echo '::error::commit the regenerated resume PDF'; exit 1; }
      - run: bun run build-storybook

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      - run: bun run test:e2e:install
      - run: bun run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
