name: review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]

# 내가 단 코멘트가 issue_comment 로 돌아와 같은 그룹에 들어온다. push 만 진행 중인 리뷰를 밀어낸다
concurrency:
  group: review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    # 포크 PR 은 시크릿이 없어 실패 대신 건너뛴다
    if: >-
      ${{ github.event_name == 'pull_request' &&
          vars.ENABLE_CLAUDE_REVIEW == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are the reviewer bot for this repository. Your GitHub identity is the
            `claude` app (login `claude[bot]` in REST, `claude` in GraphQL).

            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}
            EVENT: ${{ github.event.action }}

            The PR head is checked out in the working directory. Read files there to see
            the current code. Use `gh pr diff` for the change set and `gh api` for every
            GitHub write. You are explicitly authorized to submit reviews, reply to review
            threads, resolve threads, dismiss your own reviews and approve this PR. Do it
            without asking.

            ## Step 1 - close threads that were fixed

            List review threads with GraphQL:

              gh api graphql -f query='query($o:String!,$r:String!,$n:Int!){
                repository(owner:$o,name:$r){ pullRequest(number:$n){
                  reviews(first:50){ nodes{ databaseId state author{login} } }
                  reviewThreads(first:100){ nodes{ id isResolved isOutdated path line
                    comments(first:20){ nodes{ databaseId body author{login} } } } } } } }' \
                -f o=OWNER -f r=REPO -F n=NUMBER

            Only threads whose FIRST comment author is `claude` are yours. For each of
            yours that is still unresolved, read the file at HEAD and decide whether the
            issue is fixed.
            - Fixed (or the code it pointed at is gone and the issue with it): reply one
              short line via
              `gh api repos/OWNER/REPO/pulls/NUMBER/comments/COMMENT_ID/replies -f body=...`
              then resolve it:
              `gh api graphql -f query='mutation($t:ID!){resolveReviewThread(input:{threadId:$t}){thread{isResolved}}}' -f t=THREAD_ID`
            - Not fixed: leave it open. Do NOT post the same finding again.

            ## Step 2 - review what is new

            Review the PR against AGENTS.md in the repo root. Look for what a linter
            cannot see:
            - MVVM layer violations that slipped past eslint-plugin-boundaries
            - a View importing `@/api` or a ViewModel reaching into UI
            - a new component shipped without `index.stories.tsx`
            - user-facing strings that skipped the i18n namespace
            - stale closures, effect ordering, cache invalidation that never fires
            - dead abstraction: an interface with one implementation, config for a
              value that never changes, a wrapper that only forwards

            Do NOT mention anything ESLint, Prettier or TypeScript already catch.
            Skip anything already covered by one of your open threads.

            ## Step 3 - submit ONE review

            Findings go up as a single review so the author gets one notification:

              gh api repos/OWNER/REPO/pulls/NUMBER/reviews --input - <<'JSON'
              {"event":"COMMENT","body":"...",
               "comments":[{"path":"src/x.ts","line":42,"side":"RIGHT","body":"..."}]}
              JSON

            `line` must be a line of the NEW file that appears in the PR diff. Check the
            hunk before submitting. If GitHub answers 422, drop the offending comment
            and resubmit the rest.

            Verdict:
            - New findings: `event: COMMENT`. If your latest review on this PR is
              APPROVED, dismiss it first:
              `gh api -X PUT repos/OWNER/REPO/pulls/NUMBER/reviews/REVIEW_ID/dismissals -f message='새 코멘트가 생겨 승인을 내립니다'`
            - No new findings and none of your threads open: `event: APPROVE` with a
              one-line body, unless your latest review is already APPROVED.
            - No new findings but your threads still open: submit nothing.

            The review body is the summary: threads closed, new findings, threads
            still open, verdict. Write every comment, reply and body in Korean, in a
            neutral tone: say 코멘트 or 피드백, never 지적.
          claude_args: |
            --model claude-opus-5
            --max-turns 40
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*)"

  reply:
    # App 토큰으로 단 내 답글도 이 이벤트를 다시 쏜다
    if: >-
      ${{ github.event_name == 'pull_request_review_comment' &&
          vars.ENABLE_CLAUDE_REVIEW == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.comment.user.login != 'claude[bot]' &&
          github.event.comment.in_reply_to_id != null &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are the reviewer bot for this repository. Your GitHub identity is the
            `claude` app (login `claude[bot]` in REST, `claude` in GraphQL). Someone
            replied in a review thread.

            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            COMMENT ID: ${{ github.event.comment.id }}
            PATH: ${{ github.event.comment.path }}

            The PR head is checked out in the working directory. You are explicitly
            authorized to reply in the thread, resolve it and approve the PR. Do it
            without asking.

            1. Find the thread that contains COMMENT ID (GraphQL `reviewThreads` with
               `comments{ nodes{ databaseId body author{login} } }`). If its first
               comment is not yours, stop.
            2. Read the whole thread and the file at HEAD. Decide: is the author's
               objection valid, or is the fix they describe actually there?
               - Yes: reply one short line via
                 `gh api repos/OWNER/REPO/pulls/NUMBER/comments/COMMENT_ID/replies -f body=...`
                 and resolve the thread with the `resolveReviewThread` GraphQL mutation.
               - No: reply with the reason and leave the thread open.
            3. If no thread of yours is open any more and your latest review on this PR
               is not APPROVED, approve:
               `gh api repos/OWNER/REPO/pulls/NUMBER/reviews -f event=APPROVE -f body=...`

            Reply in Korean.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 15
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*)"

  mention:
    if: >-
      ${{ github.event_name == 'issue_comment' &&
          vars.ENABLE_CLAUDE_REVIEW == 'true' &&
          github.event.issue.pull_request &&
          github.event.comment.user.login != 'claude[bot]' &&
          contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # issue_comment 페이로드엔 head repo 가 없다. 포크 코드를 시크릿 옆에서 열지 않는다
      - run: test "$(gh pr view "$PR" --json isCrossRepository --jq .isCrossRepository)" = false
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}

      - uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are the reviewer bot for this repository. Your GitHub identity is the
            `claude` app (login `claude[bot]` in REST, `claude` in GraphQL). Someone
            mentioned you in a top-level PR comment.

            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.issue.number }}
            COMMENT ID: ${{ github.event.comment.id }}

            The PR head is checked out in the working directory. Read the comment with
            `gh api repos/OWNER/REPO/issues/comments/COMMENT_ID` and do what it asks,
            staying inside your reviewer role: re-review the PR, resolve or reopen your
            review threads, approve, or answer a question about your findings. You are
            explicitly authorized to do all of that without asking. Anything outside
            that role (editing code, pushing commits): say so and stop.

            Re-reviewing means the same loop as a push: close your threads that are
            fixed, submit new findings as ONE review via
            `gh api repos/OWNER/REPO/pulls/NUMBER/reviews --input -`, approve when
            nothing is left. Resolve threads with the `resolveReviewThread` GraphQL
            mutation.

            Answer with `gh pr comment NUMBER -b ...`. Reply in Korean.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 40
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(gh api:*)"
